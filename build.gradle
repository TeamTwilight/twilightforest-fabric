import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

wrapper {
	gradleVersion = '9.8.2'
	distributionType = Wrapper.DistributionType.ALL
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
	secretsFile.withInputStream { stream -> secrets.load(stream) }

	fileTree("secrets").matching {
		include "**/*.properties"
	}.each { File file ->
		file.withInputStream { stream -> secrets.load(stream) }
	}
}

version = (hasProperty("CIRevision") ? CIRevision : project.mod_version)
group = group_name

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(25))
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.addAll([
		"-Xlint:all,-classfile,-processing,-deprecation,-this-escape",
		"-Werror",
		"-Xmaxerrs", "1000000",
		"-Xmaxwarns", "1000000"
	])
	options.encoding = 'UTF-8'
}

base {
	archivesName = "${project.mod_id}-${project.minecraft_version}"
}

subprojects {
	version = project(":").version
}

loom {
	accessWidenerPath = file("src/main/resources/twilightforest.classtweaker")
	enableTransitiveAccessWideners = true

	interfaceInjection {
		enableDependencyInterfaceInjection = true
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		createSourceSet = true
		outputDirectory = file("src/main/generated/resources")
	}
}

repositories {
	mavenLocal()
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
	maven { url = "https://maven.terraformersmc.com/" } // ModMenu
	maven { url = "https://maven.blamejared.com/" } // JEI
	maven { url = "https://api.modrinth.com/maven" } // Jade
}

dependencies {
	// Minecraft & Fabric
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// NeoForge Config API
	include(implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")

	// Built-in library
	implementation(include(project(":carminite-lib")))

	// Compatibility
	implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
	implementation "maven.modrinth:jade:${project.jade_version}"
	implementation "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

processResources {
	def ver = project.version
	def loaderVer = project.property("loader_version")
	def baseMinecraftVer = project.property("base_minecraft_version")
	def fabricVer = project.property("fabric_api_version")
	def javaVer = java.toolchain.languageVersion.get().asInt()

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", ver

	filesMatching("fabric.mod.json") {
		expand([
			"version"             : ver,
			"loader_version"      : loaderVer,
			"minecraft_version"   : baseMinecraftVer,
			"fabric_api_version"  : fabricVer,
			"java_version"        : javaVer
		])
	}

	exclude ".cache"

	def lazyTree = providers.provider {
		fileTree(dir: getOutputs().getFiles().getAsPath(), includes: ["**/*.json", "**/*.mcmeta"])
	}

	doLast {
		lazyTree.get().each { File file ->
			file.setText(JsonOutput.toJson(new JsonSlurper().parse(file)))
		}
	}
}

jar {
	exclude 'data/twilightforest/function/**'

	manifest {
		attributes([
			'Specification-Title'     : mod_id,
			'Specification-Vendor'    : "TeamTwilight",
			'Specification-Version'   : "1",
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : "TeamTwilight",
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

tasks.register('sourceJar', Jar) {
	dependsOn 'classes'
	from sourceSets.main.allSource
	archiveClassifier = 'sources'
}

def mavenUser = System.getenv("MAVEN_USER") ?: secrets.getProperty("maven_username")
def mavenToken = System.getenv("MAVEN_PASS") ?: secrets.getProperty("maven_password")

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifact jar
			artifact sourceJar

			groupId = 'team-twilight'
			artifactId = project.mod_id
		}
	}

	repositories {
		maven {
			url "https://maven.tamaized.com/releases"
			credentials {
				username mavenUser
				password mavenToken
			}
		}
	}
}